name: Installer HADRA CPU
description: Python, ffmpeg, PyTorch CPU, F5-TTS et poids figés en cache
runs:
  using: composite
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: pip
        cache-dependency-path: scripts/hadra/requirements.txt
    - shell: bash
      run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends ffmpeg
    - shell: bash
      run: |
        python -m pip install torch==2.8.0 torchaudio==2.8.0 torchcodec==0.7.0 --index-url https://download.pytorch.org/whl/cpu
        python -m pip install -r scripts/hadra/requirements.txt
    - uses: actions/cache@v4
      with:
        path: ~/.cache/huggingface
        key: hadra-0f9beec11-vocos-0feb3fdd9

name: Reprendre la publication du test audio
on:
  push:
    branches: [feat/hadra-tts]
    paths: [.github/workflows/hadra-retry-preview.yml]
permissions:
  actions: write
jobs:
  retry:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Refaire le contrôle HTTP maintenant que Pages est déployé
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run rerun 38595070214 --failed --repo mcofirty/Darijapp

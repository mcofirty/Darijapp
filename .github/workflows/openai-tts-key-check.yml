name: Vérifier la clé du test vocal OpenAI
on:
  push:
    branches: [feat/hadra-tts]
    paths: [.github/workflows/openai-tts-key-check.yml]
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Vérifier uniquement la présence du secret
        env:
          DARIJA_TTS_KEY: ${{ secrets.DARIJA_TTS_KEY || secrets.OPENAI_API_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import os, json, subprocess, base64, pathlib, datetime
          present = bool(os.environ.get('DARIJA_TTS_KEY'))
          result = {'checked_at': datetime.datetime.now(datetime.timezone.utc).isoformat(),
                    'key_present': present, 'api_authorization_verified': False,
                    'paid_requests': 0, 'status': 'key_present' if present else 'missing_api_key'}
          target = 'repos/mcofirty/Darijapp/contents/docs/openai-tts/key-status.json'
          body = {'branch': 'feat/hadra-tts', 'message': 'docs: vérifie la présence de la clé OpenAI sans requête payante',
                  'content': base64.b64encode(json.dumps(result, indent=2).encode()).decode()}
          old = subprocess.run(['gh', 'api', target + '?ref=feat/hadra-tts', '--jq', '.sha'], capture_output=True, text=True)
          if old.returncode == 0: body['sha'] = old.stdout.strip()
          path = pathlib.Path('/tmp/openai-key-status.json'); path.write_text(json.dumps(body))
          subprocess.run(['gh', 'api', '--method', 'PUT', target, '--input', str(path)], check=True, stdout=subprocess.DEVNULL)
          print(json.dumps(result))
          PY

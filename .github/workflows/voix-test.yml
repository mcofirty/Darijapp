# Fait dire les mots des paires de sons par d'autres voix arabes d'Azure (tests du score de prononciation).
# Se lance à la main depuis l'onglet Actions.
name: Voix de test

on:
  workflow_dispatch:

jobs:
  voix:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Générer les voix de test (Azure Speech)
        continue-on-error: true
        env:
          AZURE_SPEECH_KEY: ${{ secrets.AZURE_SPEECH_KEY }}
          AZURE_SPEECH_REGION: ${{ secrets.AZURE_SPEECH_REGION }}
        run: python scripts/modele/voix_test.py
      - name: Enregistrer dans le repo
        if: always()
        run: |
          if [ -n "$(git status --porcelain scripts/modele/voix-test)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add scripts/modele/voix-test
            git commit -m "feat: voix de test pour le score de prononciation"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

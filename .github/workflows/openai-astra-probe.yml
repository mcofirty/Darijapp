name: Tester réellement les sorties audio Astra
on:
  push:
    branches: [feat/hadra-tts]
    paths: [.github/workflows/openai-astra-probe.yml]
concurrency:
  group: openai-tts-pilot-10
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/cache/restore@v4
        with:
          path: artifacts/astra-probe
          key: astra-audio-probe-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: astra-audio-probe-v1-
      - name: Tester l’identité du modèle, le plafond et l’absence de retry
        run: python -m unittest discover -s scripts/openai_tts -p 'test_astra*.py'
      - run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends ffmpeg
          python -m pip install numpy==2.2.6 websocket-client==1.8.0
      - name: Vérifier le modèle puis essayer un mot sur deux interfaces au maximum
        env:
          DARIJA_TTS_KEY: ${{ secrets.DARIJA_TTS_KEY || secrets.OPENAI_API_KEY }}
        run: python scripts/openai_tts/astra_probe.py
      - name: Vérifier aussi Realtime avec Astra, une réponse maximum
        env:
          DARIJA_TTS_KEY: ${{ secrets.DARIJA_TTS_KEY || secrets.OPENAI_API_KEY }}
        run: python scripts/openai_tts/astra_realtime_probe.py
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: artifacts/astra-probe
          key: astra-audio-probe-v1-${{ github.run_id }}-${{ github.run_attempt }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: astra-audio-capability-test
          path: artifacts/astra-probe
          retention-days: 30
      - name: Enregistrer uniquement le résultat sans secret
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.run_id }}
        run: |
          python - <<'PY'
          import json,pathlib,subprocess,base64,os
          path=pathlib.Path('artifacts/astra-probe/status.json')
          result=json.loads(path.read_text()) if path.exists() else {'status':'setup_failed','requested_model':'gpt-6-astra'}
          realtime=path.parent/'realtime-status.json'
          if realtime.exists():
              result['realtime']=json.loads(realtime.read_text())
              result['audio_files_generated']=result.get('audio_files_generated',0)+result['realtime']['audio_files_generated']
              if result['realtime']['status']=='audio_ready_for_pilot':result['status']='audio_ready_via_realtime'
          result['run_id']=os.environ['RUN_ID']
          target='repos/mcofirty/Darijapp/contents/docs/openai-tts/astra-probe-status.json'
          body={'branch':'feat/hadra-tts','message':'docs: relève les tests réels de sortie audio Astra',
                'content':base64.b64encode(json.dumps(result,ensure_ascii=False,indent=2).encode()).decode()}
          old=subprocess.run(['gh','api',target+'?ref=feat/hadra-tts','--jq','.sha'],capture_output=True,text=True)
          if old.returncode==0:body['sha']=old.stdout.strip()
          temp=pathlib.Path('/tmp/astra-probe-status.json');temp.write_text(json.dumps(body))
          subprocess.run(['gh','api','--method','PUT',target,'--input',str(temp)],check=True,stdout=subprocess.DEVNULL)
          print(json.dumps(result,ensure_ascii=False))
          PY

name: Reprendre le pilote OpenAI après ajout de crédit
on:
  push:
    branches: [feat/hadra-tts]
    paths: [.github/workflows/openai-tts-resume.yml]
permissions:
  actions: write
jobs:
  resume:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Reprendre les dix mots autorisés sans élargir le pilote
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run rerun 38605552834 --failed --repo mcofirty/Darijapp

name: Générer le test OpenAI de cinquante mots
on:
  push:
    branches: [feat/hadra-tts]
    paths: [.github/workflows/openai-tts-fifty.yml]
concurrency:
  group: openai-tts-pilot-10
  cancel-in-progress: false
permissions:
  contents: write
  actions: write
jobs:
  fifty:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: caa427c6c1409ff34dd4e5985205b009e41d45be
          path: baseline-site
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/cache/restore@v4
        with:
          path: artifacts/openai-fifty
          key: openai-fifty-v1-${{ hashFiles('scripts/openai_tts/pilot-50.json', 'scripts/openai_tts/audio-text-overrides.json') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            openai-fifty-v1-${{ hashFiles('scripts/openai_tts/pilot-50.json', 'scripts/openai_tts/audio-text-overrides.json') }}-
      - run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends ffmpeg
          python -m pip install numpy==2.2.6
      - name: Tester le budget de 49 appels, la reprise et les 100 empreintes
        run: python -m unittest discover -s scripts/openai_tts -p 'test_*.py'
      - name: Réutiliser le candidat préféré et générer 49 nouveaux MP3 au maximum
        env:
          DARIJA_TTS_KEY: ${{ secrets.DARIJA_TTS_KEY || secrets.OPENAI_API_KEY }}
        run: python scripts/openai_tts/fifty.py generate --baseline baseline-site/public/test-audio-phonetic
      - name: Construire le comparatif de cinquante entrées
        run: python scripts/openai_tts/fifty.py build
      - uses: actions/upload-artifact@v4
        with:
          name: openai-fifty-offline
          path: artifacts/openai-fifty-site
          retention-days: 30
      - uses: actions/checkout@v4
        with:
          ref: main
          path: main-site
      - name: Lire CLAUDE et publier uniquement le comparatif
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/openai_tts/fifty.py publish --checkout main-site
      - name: Vérifier les 100 MP3 et la page effectivement servis
        run: python scripts/openai_tts/fifty.py check
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: artifacts/openai-fifty
          key: openai-fifty-v1-${{ hashFiles('scripts/openai_tts/pilot-50.json', 'scripts/openai_tts/audio-text-overrides.json') }}-${{ github.run_id }}-${{ github.run_attempt }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: openai-fifty-diagnostics
          path: artifacts/openai-fifty
          retention-days: 30
      - name: Enregistrer le bilan sans secret
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.run_id }}
        run: |
          python - <<'PY'
          import json,pathlib,subprocess,base64,os
          root=pathlib.Path('artifacts/openai-fifty')
          path=root/'status.json'
          result=json.loads(path.read_text()) if path.exists() else {'status':'setup_failed'}
          result['run_id']=os.environ['RUN_ID']
          http=root/'http-check.json'
          if http.exists():result['http_check']=json.loads(http.read_text())
          for name,data in [('fifty-status.json',result),('fifty-review-queue.json',None)]:
              if data is None:
                  queue=root/'review-queue.json'
                  if not queue.exists():continue
                  data=json.loads(queue.read_text())
              target='repos/mcofirty/Darijapp/contents/docs/openai-tts/'+name
              body={'branch':'feat/hadra-tts','message':'docs: relève le test OpenAI de cinquante mots',
                    'content':base64.b64encode(json.dumps(data,ensure_ascii=False,indent=2).encode()).decode()}
              old=subprocess.run(['gh','api',target+'?ref=feat/hadra-tts','--jq','.sha'],capture_output=True,text=True)
              if old.returncode==0:body['sha']=old.stdout.strip()
              temp=pathlib.Path('/tmp/openai-fifty-'+name);temp.write_text(json.dumps(body))
              subprocess.run(['gh','api','--method','PUT',target,'--input',str(temp)],check=True,stdout=subprocess.DEVNULL)
          print(json.dumps(result,ensure_ascii=False))
          PY

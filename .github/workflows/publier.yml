# Lance les tests, construit l'appli et la publie sur GitHub Pages, en 2 minutes environ.
# Se déclenche à chaque push sur main, à la fin de chaque génération « Audio » (pour publier les
# nouveaux MP3, que les commits du bot ne déclenchent pas), ou à la main depuis l'onglet Actions.
name: Publier

on:
  push:
    branches: [main]
  workflow_run:
    workflows: [Audio]
    types: [completed]
  workflow_dispatch:

# Seule la dernière version compte : une publication en attente ou en cours est remplacée par la suivante.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Toujours la dernière version de main (code et MP3).
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # ffmpeg décode les MP3 pour le test de calibrage du score de prononciation.
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends ffmpeg
      - run: npm test
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - id: deploiement
        uses: actions/deploy-pages@v4

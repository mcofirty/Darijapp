<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo-favicon.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/logo-180.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Darijaapp" />
    <meta name="theme-color" content="#f2f2f7" />
    <title>Darijaapp</title>
    <script>
      // Apparence choisie dans le Profil, appliquée avant le premier affichage.
      try {
        document.documentElement.dataset.theme = localStorage.getItem('darija-apparence') || 'systeme'
        document.documentElement.dataset.couleur = localStorage.getItem('darija-couleur') || 'drapeau'
      } catch (e) {}
    </script>
    <style>
      /* Animation d'ouverture (src/app/lancement.ts) : fond de la couleur de la vidéo, sans attendre le CSS. */
      #lancement { position: fixed; inset: 0; z-index: 100; background: #0d0c0f; transition: opacity 0.4s ease; }
      #lancement.efface { opacity: 0; }
      #lancement video, #lancement img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
    </style>
  </head>
  <body>
    <div id="lancement" aria-hidden="true"><video muted playsinline preload="none"></video></div>
    <script>
      // Pas d'animation sur les pages destinées à la personne qui ajoute des mots.
      if (/^#(ajout|mot=)/.test(location.hash)) document.getElementById('lancement').remove()
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

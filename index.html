<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/pot-favicon.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/pot-180.png" />
    <!-- Pas de zoom : l'appli se règle par la taille du texte de l'iPhone (Dynamic Type), pas au pincement. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Darijaapp" />
    <meta name="theme-color" content="#f2f2f7" />
    <title>Darijaapp</title>
    <script>
      // Apparence choisie dans le Profil, appliquée avant le premier affichage.
      try {
        document.documentElement.dataset.theme = localStorage.getItem('darija-apparence') || 'systeme'
        document.documentElement.dataset.couleur = localStorage.getItem('darija-couleur') || 'drapeau'
      } catch (e) {}
    </script>
    <style>
      /* Animation d'ouverture (src/app/lancement.ts) : fond de la couleur de la vidéo, sans attendre le CSS. */
      #lancement { position: fixed; inset: 0; z-index: 100; background: #0d0c0f; transition: opacity 0.4s ease; }
      #lancement.efface { opacity: 0; }
      #lancement video, #lancement img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
      /*
       * Portrait seulement. iOS ignore l'orientation du manifeste : téléphone tourné (écran bas et tactile),
       * un écran demande de le remettre droit et cache l'appli. Les tablettes et ordinateurs ne sont pas concernés.
       */
      #paysage { display: none; }
      @media (orientation: landscape) and (max-height: 500px) and (hover: none) and (pointer: coarse) {
        #paysage {
          display: flex; position: fixed; inset: 0; z-index: 200; flex-direction: column; align-items: center; justify-content: center;
          gap: 14px; padding: 24px; background: #1b1918; color: #fbf7f3; text-align: center;
          font: 600 17px/1.3 -apple-system, system-ui, sans-serif;
        }
        #paysage p { margin: 0; max-width: 22em; }
        #paysage p + p { font-weight: 400; font-size: 15px; color: rgba(240, 232, 225, 0.62); }
        #root, #lancement { visibility: hidden; }
      }
    </style>
  </head>
  <body>
    <div id="lancement" aria-hidden="true"><video muted playsinline preload="none"></video></div>
    <script>
      // Pas d'animation sur les pages destinées à la personne qui ajoute des mots.
      if (/^#(ajout|mot=)/.test(location.hash)) document.getElementById('lancement').remove()
    </script>
    <div id="paysage" role="alert">
      <svg width="56" height="56" viewBox="0 0 24 24" fill="none" stroke="#ff7f6b" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <rect x="7" y="2" width="10" height="20" rx="2.5" />
        <path d="M11 18.5h2" />
      </svg>
      <p>Remets ton téléphone à la verticale</p>
      <p>Darijaapp se joue en portrait.</p>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
